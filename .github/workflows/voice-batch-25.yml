name: Reviewed voice batch 25
run-name: Reviewed voice batch 25
on:
  push:
    paths:
      - config/voice-request-20261027-25.json
permissions:
  contents: write
  actions: write
concurrency:
  group: reviewed-voice-automation
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main' && github.repository == 'Alicetel-u/FeralLife'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Non-generating request validation
        id: plan
        run: |
          REQUEST_JSON="$(cat config/voice-request-20261027-25.json)" node tools/voice-automation.mjs prepare
          npm run build
          npm test
      - name: Install audio tooling
        if: steps.plan.outputs.noop != 'true'
        run: |
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          command -v ffmpeg
      - name: Persist charged-request guard
        if: steps.plan.outputs.noop != 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY1 || secrets.ELEVENLABS_API_KEY }}
        run: |
          node tools/voice-automation.mjs begin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/voice-automation-runs.json
          git commit -m 'Begin reviewed voice batch 25'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Generate only the 25 marked NG recordings
        if: steps.plan.outputs.noop != 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY1 || secrets.ELEVENLABS_API_KEY }}
        run: node tools/voice-automation.mjs generate
      - name: Build and test restored game
        if: steps.plan.outputs.noop != 'true'
        run: |
          npm run build
          npm test
      - name: Commit verified audio and decisions
        if: steps.plan.outputs.noop != 'true'
        run: |
          node tools/voice-automation.mjs complete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish reviewed voice batch 25'
          git fetch origin main
          git rebase origin/main
          npm run build
          npm test
          git push origin HEAD:main
      - name: Trigger Pages for the committed recordings
        if: steps.plan.outputs.noop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches --method POST -f ref=main
      - name: Preserve audio and recovery state on any error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-batch-25-recovery-${{ github.run_id }}
          path: |
            .local/voice-automation-state.json
            .local/voice-plan.json
            .local/voice-journal.json
            config/voice-repairs.json
            config/voice-review-published.json
            config/voice-automation-runs.json
            src/voice-manifest.js
            src/voice-review-catalog.js
            assets/voices/*.mp3
          include-hidden-files: true
          retention-days: 14
